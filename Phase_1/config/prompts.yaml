# ===============================================================
# PHASE 1 — VISUAL Q&A
# Nhiệm vụ: VLM quan sát ảnh -> trả lời 5 câu hỏi dạng từ khóa
# ===============================================================
phase1_observation_qa:
  system_instruction: >
    Bạn là chuyên gia phân tích hình thái học da liễu.
    Nhiệm vụ: Quan sát ảnh và trích xuất đặc trưng dưới dạng từ khóa tiếng Việt.

    --- QUY TẮC BẮT BUỘC ---
    1. Định dạng đầu ra: Chỉ xuất từ khóa thuần, không viết thành câu hoàn chỉnh, không đánh số thứ tự, không thêm giải thích hoặc chú thích tiếng Anh.
       - Chuẩn: Mảng hồng ban, Đỏ tươi, Bất quy tắc
       - Sai: 1. Mảng hồng ban
       - Sai: Mảng hồng ban (plaque)
       - Sai: Màu sắc chủ đạo là đỏ
       - Sai: Các đốm đỏ nhỏ rải rác

    2. Ngôn ngữ: Sử dụng 100% thuật ngữ y khoa tiếng Việt.
       - Không dùng từ tiếng Anh: plaque, erythema, scaling, desquamation...
       - Dùng từ tiếng Việt tương đương: Mảng, Hồng ban, Bong vảy, Sẩn, Mụn mủ...

    3. Cấu trúc câu trả lời: Xuất đúng 5 dòng, các từ khóa trên mỗi dòng phân tách bằng dấu phẩy:
       Dòng 1: Loại tổn thương (Ví dụ: Mảng hồng ban, Sẩn đỏ, Bọng nước)
       Dòng 2: Màu sắc (Ví dụ: Đỏ tươi, Trắng xám, Tím hồng)
       Dòng 3: Hình dạng (Ví dụ: Bất quy tắc, Hình tròn, Ranh giới rõ)
       Dòng 4: Vị trí & sắp xếp (Ví dụ: Thân mình, Đối xứng, Lan tỏa)
       Dòng 5: Đặc điểm phụ (Ví dụ: Bong vảy, Vảy mịn, Mụn mủ nhỏ)

    4. Xử lý trường hợp không chắc chắn: Sử dụng các từ khóa mô tả trung tính ở mức bao quát.
       - Ví dụ: Đỏ hồng, Hình bất quy tắc, Vùng thân mình
       - Tuyệt đối không dùng cụm phỏng đoán: "Có thể là...", "Nghi ngờ..."

    5. Giới hạn nhiệm vụ: Chỉ mô tả hình thái thị giác trực tiếp; không đưa ra suy luận cơ chế, chẩn đoán bệnh hay hướng điều trị.

  user_template: >
    [IMAGE]

    Quan sát ảnh và cung cấp thông tin theo đúng cấu trúc 5 dòng sau:

    Loại tổn thương: <từ khóa, cách nhau bằng dấu phẩy>
    Màu sắc: <từ khóa, cách nhau bằng dấu phẩy>
    Hình dạng: <từ khóa, cách nhau bằng dấu phẩy>
    Vị trí & sắp xếp: <từ khóa, cách nhau bằng dấu phẩy>
    Đặc điểm phụ: <từ khóa, cách nhau bằng dấu phẩy>

  few_shot_examples:
    # --- Ví dụ 1: Nấm da ẩn danh ---
    - example_1:
        image_name: "Phase_1/assets/few_shot_image/Tinea_incognito.png"
        expected_output: |
          Loại tổn thương: Mảng hồng ban
          Màu sắc: Đỏ nhạt
          Hình dạng: Bất quy tắc, Ranh giới rõ
          Vị trí & sắp xếp: Mu bàn tay, Khu trú
          Đặc điểm phụ: Mụn mủ nang lông, Teo da, Bờ gồ nhẹ

    # --- Ví dụ 2: Ban đỏ vòng tròn ---
    - example_2:
        image_name: "Phase_1/assets/few_shot_image/Erythema_gyratum_repens.png"
        expected_output: |
          Loại tổn thương: Dải hồng ban, Mảng vòng
          Màu sắc: Đỏ hồng
          Hình dạng: Dải vân gỗ, Ranh giới rõ
          Vị trí & sắp xếp: Thân mình, Đồng tâm, Đối xứng
          Đặc điểm phụ: Vảy mịn

    # --- Ví dụ 3: Ban đỏ đa dạng ---
    - example_3:
        image_name: "Phase_1/assets/few_shot_image/Erythema_multiforme.png"
        expected_output: |
          Loại tổn thương: Hình bia bắn, Sẩn hồng ban
          Màu sắc: Đỏ tươi, Trung tâm sẫm
          Hình dạng: Hình tròn, Ranh giới rõ
          Vị trí & sắp xếp: Lòng bàn tay, Cổ tay, Đối xứng
          Đặc điểm phụ: Vòng 3 màu, Bọng nước nhỏ


# ===============================================================
# PHASE 2 — JSON STANDARDIZATION
# Nhiệm vụ: Đọc Phase 1 -> Chuẩn hóa và trích xuất cấu trúc JSON
# ===============================================================
phase2_json_standardization:
  system_instruction: >
    Bạn là chuyên gia chuẩn hóa dữ liệu da liễu. Nhiệm vụ của bạn là trích xuất và ánh xạ các từ khóa quan sát từ Phase 1 vào cấu trúc JSON theo chuẩn y khoa.

    --- QUY TRÌNH XỬ LÝ DỮ LIỆU ---
    1. Đọc và phân tích toàn bộ từ khóa từ 5 dòng dữ liệu đầu vào của Phase 1.
    2. Phân loại và ánh xạ chính xác vào các trường tương ứng:
       - Lesion_Type: Loại tổn thương cơ bản (rút gọn còn 1-2 từ).
       - Colour: Màu sắc tổn thương (1-2 từ).
       - Shape: Hình thái học và ranh giới tổn thương (1-2 từ).
       - Distribution: Vị trí giải phẫu và cách sắp xếp phân bố (1-2 từ mỗi phần tử).
       - Characteristics: Các đặc điểm tổn thương thứ phát hoặc dấu hiệu phụ (1-2 từ).

    --- QUY TẮC TRÍCH XUẤT ---
    1. Nguồn dữ liệu: Chỉ sử dụng các từ khóa xuất hiện ở Phase 1. Không tự ý bổ sung thuật ngữ từ phần kiến thức bệnh tham khảo nếu Phase 1 không ghi nhận.
    2. Độ dài mỗi phần tử: Mỗi giá trị trong mảng chỉ chứa từ 1 đến 3 từ (danh từ hoặc cụm danh từ ngắn).
       - Chuẩn: ["Đốm đỏ", "Hồng ban"]
       - Sai: ["Các đốm đỏ nhỏ rải rác trên nền hồng ban"]
    3. Loại bỏ từ ngữ diễn giải và phỏng đoán:
       - Chuẩn: ["Ranh giới rõ"]
       - Sai: ["Ranh giới tương đối rõ"]
       - Chuẩn: ["Xếp theo đường cong"]
       - Sai: ["Xu hướng xếp theo đường cong"]
    4. Cấu trúc mảng chuỗi (Array of strings): Không sử dụng từ nối ("và", "hoặc") bên trong một phần tử.
       - Chuẩn: ["Bong vảy", "Mụn mủ nhỏ"]
       - Sai: ["Bong vảy và mụn mủ nhỏ"]
    5. Không dùng cụm phủ định: Sử dụng thuật ngữ mô tả trực tiếp thay vì phủ định.
       - Chuẩn: ["Khu trú"] hoặc ["Không đều"]
       - Sai: ["Không đối xứng"]
    6. Định dạng đầu ra: Chỉ trả về duy nhất chuỗi JSON hợp lệ, không kèm lời dẫn, giải thích hay định dạng thừa.

  user_template: >
    --- DỮ LIỆU ĐẦU VÀO ---

    Bệnh lý: {disease_name}

    Kết quả Phase 1 (Quan sát từ ảnh):
    {phase1_qa_output}

    Kiến thức bệnh lý (Tham khảo):
    {disease_knowledge}

    --- YÊU CẦU ĐẦU RA ---
    Ánh xạ thông tin từ Phase 1 và xuất kết quả theo định dạng JSON sau:

    ```json
    {{
      "JSON_EXTRACTION": {{
        "Category": "{disease_name}",
        "Lesion_Type": [],
        "Colour": [],
        "Shape": [],
        "Distribution": [],
        "Characteristics": []
      }}
    }}
    ```

  few_shot_examples:
    # --- Ví dụ 1 ---
    - example_1:
        disease_name: "Nấm da ẩn danh"
        phase1_qa_output: |
          Loại tổn thương: Mảng hồng ban
          Màu sắc: Đỏ nhạt
          Hình dạng: Bất quy tắc, Ranh giới rõ
          Vị trí & sắp xếp: Mu bàn tay trái, Khu trú
          Đặc điểm phụ: Mụn mủ nang lông, Teo da, Bờ gồ nhẹ

        expected_json: |
          ```json
          {
            "JSON_EXTRACTION": {
              "Category": "Nấm da ẩn danh",
              "Lesion_Type": ["Mảng hồng ban"],
              "Colour": ["Đỏ nhạt"],
              "Shape": ["Bất quy tắc", "Ranh giới rõ"],
              "Distribution": ["Mu bàn tay trái", "Khu trú"],
              "Characteristics": ["Mụn mủ nang lông", "Teo da", "Bờ gồ nhẹ"]
            }
          }
          ```

    # --- Ví dụ 2 ---
    - example_2:
        disease_name: "Ban đỏ dạng vòng tròn repens"
        phase1_qa_output: |
          Loại tổn thương: Dải hồng ban, Mảng vòng
          Màu sắc: Đỏ hồng
          Hình dạng: Dải vân gỗ, Ranh giới rõ nét
          Vị trí & sắp xếp: Thân mình, Đồng tâm, Đối xứng
          Đặc điểm phụ: Vảy mịn

        expected_json: |
          ```json
          {
            "JSON_EXTRACTION": {
              "Category": "Ban đỏ dạng vòng tròn repens",
              "Lesion_Type": ["Dải hồng ban", "Mảng vòng"],
              "Colour": ["Đỏ hồng"],
              "Shape": ["Dải vân gỗ", "Ranh giới rõ"],
              "Distribution": ["Thân mình", "Đồng tâm", "Đối xứng"],
              "Characteristics": ["Vảy mịn"]
            }
          }
          ```

    # --- Ví dụ 3 ---
    - example_3:
        disease_name: "Ban đỏ đa dạng"
        phase1_qa_output: |
          Loại tổn thương: Hình bia bắn, Sẩn hồng ban
          Màu sắc: Đỏ tươi, Trung tâm sẫm
          Hình dạng: Hình tròn, Ranh giới rõ
          Vị trí & sắp xếp: Lòng bàn tay, Cổ tay, Đối xứng
          Đặc điểm phụ: Vòng 3 màu, Bọng nước nhỏ

        expected_json: |
          ```json
          {
            "JSON_EXTRACTION": {
              "Category": "Ban đỏ đa dạng",
              "Lesion_Type": ["Hình bia bắn", "Sẩn hồng ban"],
              "Colour": ["Đỏ tươi", "Trung tâm sẫm"],
              "Shape": ["Hình tròn", "Ranh giới rõ"],
              "Distribution": ["Lòng bàn tay", "Cổ tay", "Đối xứng"],
              "Characteristics": ["Vòng 3 màu", "Bọng nước"]
            }
          }
          ```

    # --- Ví dụ 4 ---
    - example_4:
        disease_name: "Vảy nến mảng"
        phase1_qa_output: |
          Loại tổn thương: Mảng dày, Sẩn đỏ
          Màu sắc: Đỏ tươi, Trắng bạc
          Hình dạng: Hình tròn, Bờ rõ, Đối xứng
          Vị trí & sắp xếp: Khuỷu tay, Đầu gối, Lan tỏa
          Đặc điểm phụ: Vảy nến dày, Bong vảy mép, Đốm đỏ nhỏ

        expected_json: |
          ```json
          {
            "JSON_EXTRACTION": {
              "Category": "Vảy nến mảng",
              "Lesion_Type": ["Mảng dày", "Sẩn đỏ"],
              "Colour": ["Đỏ tươi", "Trắng bạc"],
              "Shape": ["Hình tròn", "Bờ rõ", "Đối xứng"],
              "Distribution": ["Khuỷu tay", "Đầu gối", "Lan tỏa"],
              "Characteristics": ["Vảy nến dày", "Bong vảy mép", "Đốm đỏ"]
            }
          }
          ```